buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {


  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

// Generate the shared asset manifest once. Defining this task in every subproject
// made multiple tasks claim the same output file, which Gradle 9 rejects.
tasks.register('generateAssetList') {
  inputs.files(fileTree("${project.rootDir}/assets/").exclude("assets.txt"))
  outputs.file("${project.rootDir}/assets/assets.txt")
  doLast {
    File assetsFolder = file("${project.rootDir}/assets/")
    File assetsFile = new File(assetsFolder, "assets.txt")
    assetsFile.text = fileTree(assetsFolder)
      .matching { exclude "assets.txt" }
      .collect { assetsFolder.relativePath(it) }
      .sort()
      .join("\n") + "\n"
  }
}

configure(subprojects) {
  apply plugin: 'java-library'
  java.sourceCompatibility = 21
  java.targetCompatibility = 21

  processResources.dependsOn rootProject.tasks.named('generateAssetList')

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'VPProject_GreenGurdian'
  repositories {
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

eclipse.project.name = 'VPProject_GreenGurdian' + '-parent'
